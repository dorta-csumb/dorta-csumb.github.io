<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Form Page</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    
    <h1> Sign Up </h1>

    <form id="signupForm" action="welcome.html">
    <!-- Observe how this form uses 5 different form elements:
    text input, radio buttons, a dropdown menu (select), a password field, and a submit button. -->

    <!-- text input below -->
     First Name:<input type="text" name="fName"><br>
     Last Name: <input type="text" name="lName"><br><br>

    <!-- radio buttons below -->
     Gender:    
         <input type="radio" name="gender" value="m">Male
         <input type="radio" name="gender" value="f">Female
         <input type="radio" name="gender" value="a">Alien<br><br>	

    <!-- text input below -->
      Zip Code: 
      <input type="text" id="zip" name="zip"> 
      <span id="zipError" style="color:red;"></span><br><br>

      <!-- the span id is used to display the city, latitude, and longitude information that is retrieved from the API call. -->
    
      City:   <span id="city"></span> <br>
      Latitude: <span id="latitude"></span> <br>
      Longitude: <span id="longitude"></span> <br><br>

      State: 
      <select id="state" name="state">
            <option value="">Select One</option> 
       </select> 
       <br>


       Select a County: 
       <select id="county"></select><br>


       Desired Username: 
       <input type="text" id="username" ><br>
       <span id="usernameError"></span>
       <br>


        Password: 
        <input type="password" id="password"> <br>
        <span id="suggestedPwd"></span> <br>
        

        Type Password Again: 
        <input type="password" id="passwordAgain"><br>
        <span id="passwordError"></span>
        <br><br>
   
         <input type="submit" value="Sign up!">

    </form>

    <script src="js/script.js"></script>

</body>

</html>
