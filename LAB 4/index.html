<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<body>
    <h1> Sign Up Form </h1>

    <fieldset>
        <legend>Sign Up</legend>
        First Name: <input type="text"><br>
        Last Name: <input type="text"><br>
        Email: <input type="text"><br>
        Phone Number:<input type="text"><br><br>
        Zip Code: <input id="zipCodeInput" type="text"><br>
        City: <span id="cityDisplay"></span>
        <br>
        Latitude: <span id="latDisplay" ></span>
        <br>
        Longitude: <span></span>
        <br><br>
        State: <select id="stateSelect"></select><br>
        Select a County: <select id="countySelect"></select><br>

        Desired Username: <input id="usernameInput" type="text"> <span id="usernameMessage"></span> <br>

        Password: <input id="passwordInput" type="password"> <span id="passwordMessage"></span><br>

        Type Password Again: <input type="password"><br>

        <input id="submitBtn" type="submit" value="Sign up!">
        <br>
        <span id="submitMessage" style="color: red;"></span>
    </fieldset>

    <script src="js/script.js"></script>

</body>

</html>
